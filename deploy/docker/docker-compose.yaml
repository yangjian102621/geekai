services:
  # mysql
  geekai-mysql:
    image: docker.m.daocloud.io/library/mysql:8.0.33
    container_name: geekai-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=mhSCk0NheGhmtsha
    ports:
      - '3306:3306'
    volumes:
      - ./conf/mysql/my.cnf:/etc/mysql/my.cnf
      - ./data/mysql/data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
      - ./data/mysql/init.d:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 10s
      retries: 10

  # redis
  geekai-redis:
    image: docker.m.daocloud.io/library/redis:6.0.6
    restart: always
    container_name: geekai-redis
    command: redis-server --requirepass mhSCk0NheGhmtsha
    volumes:
      - ./data/redis:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 5

  geekai-tika:
    image: docker.m.daocloud.io/apache/tika:latest
    container_name: geekai-tika
    restart: always
    ports:
      - '9998:9998'

  # 后端 API 程序
  geekai-api:
    image: 10.8.65.4/geekai/geekai-api:v4.3.1-amd64
    container_name: geekai-api
    restart: always
    depends_on:
      geekai-mysql:
        condition: service_healthy
      geekai-redis:
        condition: service_healthy
    environment:
      - DEBUG=false
      - LOG_LEVEL=info
      - CONFIG_FILE=config.toml
    # 后端仅供容器网络内部访问，对外流量统一走 geekai-web(nginx) 的 8000 端口
    expose:
      - '5000'
    volumes:
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime
      - ./conf/config.toml:/var/www/app/config.toml
      - ./logs/app:/var/www/app/logs
      - ./static:/var/www/app/static
      - ./data/leveldb:/var/www/app/data
      # 官网安装包与 latest.json，供 /api/v1/latest、/api/v1/download 和 /update 使用
      - ./update:/var/www/app/update

  # 前端静态资源 + nginx 反向代理，统一对外入口 8000
  geekai-web:
    image: 10.8.65.4/geekai/geekai-web:v4.3.1-amd64
    container_name: geekai-web
    restart: always
    depends_on:
      - geekai-api
    ports:
      - '8000:8000'
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./conf/nginx/conf.d:/etc/nginx/conf.d
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf
