map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 统一入口：所有对外流量走本机 8000 端口。
# 动静分离：
#   - 静态：本机 /var/www/app/dist 下的 SPA（门户 / 与控制台 /admin 同属一个 Vue 应用）
#   - 动态：/api/、/v1/events、/static/、/update/ 反代到后端 geekai-api:5000
# 其余路径（含 /admin、/login、/register）一律回退 index.html，由前端路由接管。
server {
    listen 8000;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    root /var/www/app/dist;
    index index.html;

    # 后端 API 与 WebSocket
    location /api/ {
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://geekai-api:5000;
    }

    # 桌面端事件上报：全局 100M 太宽，这里收到 1m，
    # 256KiB~1m 的超限请求透传给后端返回结构化 413，>1m 由 nginx 直接拒绝。
    location = /v1/events {
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://geekai-api:5000;
    }

    # 用户上传的静态文件
    location /static/ {
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_pass http://geekai-api:5000;
    }

    # 桌面端安装包（几百 MB），延长读超时避免慢速下载被掐断。
    location /update/ {
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://geekai-api:5000;
    }

    # SPA 回退：门户 /、/invite、/pricing、/space 与控制台 /admin/* 都由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
