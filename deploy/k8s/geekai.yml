---
apiVersion: v1
kind: Namespace
metadata:
  name: thinkbuddy
---
# Store uploads, LevelDB data and API logs in PVC subdirectories.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geekai-data-pvc
  namespace: thinkbuddy
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: csi-cephfs-sc
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: geekai-api
  namespace: thinkbuddy
spec:
  type: ClusterIP
  selector:
    app: geekai
  ports:
    - name: api
      port: 5000
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geekai
  namespace: thinkbuddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: geekai
  template:
    metadata:
      labels:
        app: geekai
    spec:
      nodeName: node1
      hostAliases:
        - ip: "10.233.1.240"
          hostnames:
            - "weknora.hanyoai.com"
      containers:
        - name: geekai-api
          image: 10.8.65.4/geekai/geekai-api:20261123-f2de7bba
          imagePullPolicy: Never
          workingDir: /var/www/app
          ports:
            - name: api
              containerPort: 5000
          env:
            - name: UPDATE_DIR
              value: "/var/www/app/static/update"
            - name: CONFIG_FILE
              value: "/var/www/app/config.toml"
            - name: GEEKAI_DEBUG
              value: "false"
            - name: GEEKAI_LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: config
              mountPath: /var/www/app/config.toml
              subPath: config.toml
              readOnly: true
            # 现有部署先将 PVC 内 update/ 中的安装包和 latest.json 复制到 static/update/。
            - name: data
              mountPath: /var/www/app/static
              subPath: static
            - name: data
              mountPath: /var/www/app/data
              subPath: data
            - name: data
              mountPath: /var/www/app/logs
              subPath: logs
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: geekai-cm
        - name: data
          persistentVolumeClaim:
            claimName: geekai-data-pvc
