apiVersion: v1
kind: ConfigMap
metadata:
  name: geekai-cm
  namespace: thinkbuddy
data:
  # 在部署机器的私有副本中填写凭据；迁移时沿用原有登录签名值。
  config.toml: |
    Listen = "0.0.0.0:5678"
    ProxyURL = ""
    MysqlDns = "root:jyMTXTTyl0Qs@tcp(10.8.65.5:3306)/geekai?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=True&loc=Local&tls=skip-verify&timeout=5s&readTimeout=30s&writeTimeout=30s"
    StaticDir = "./static"
    StaticUrl = "/static"
    TikaHost = "http://127.0.0.1:9998"

    TokengineServiceToken = "9CIt9gN0HYzbUx6B3/MLQ20VLx/U    "

    [Session]
      SecretKey = "67721710105b10757bf4ed5825d3bccf81c2714aa7244101c76c214449c1fbe4"
      MaxAge = 86400

    [AdminSession]
      SecretKey = "06a277f712b54ba580daab35d9ce1d0fa6ae91ac432743120d69b8f730b4ab69"
      MaxAge = 8640000

    [Redis]
      Host = "10.8.65.5"
      Port = 6379
      Password = "PwPQgb4c175I"
      DB = 3

    [OSS]
      Active = "local"

    [OSS.Local]
      BasePath = "./static/upload"
      BaseURL = "https://thinkbuddy-t.hanyoai.com/static/upload"

    [TokengineOAuth]
      Enabled = true
      BaseURL = "https://tokengine.hanyoai.com"
      InternalBaseURL = "http://new-api.tokengine.svc.cluster.local:3000"
      ClientID = "thinkbuddy-web"
      RedirectURL = "https://thinkbuddy-t.hanyoai.com/api/user/login/tokengine/callback"

  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;
        sendfile on;
        client_max_body_size 100m;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        server {
            listen 8000;
            root /var/www/app/dist;
            index index.html;

            proxy_http_version 1.1;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            location = /admin {
                try_files /index.html =404;
            }

            location /admin/ {
                try_files $uri $uri/ /index.html;
            }

            location ~ ^/(login|register)/?$ {
                try_files /index.html =404;
            }
            location = /v1/events {
                proxy_pass http://127.0.0.1:5000;
            }

            location /api/ {
                proxy_pass http://127.0.0.1:5000;
            }

            location /static/ {
                proxy_pass http://127.0.0.1:5000;
            }

            location /update/ {
                proxy_pass http://127.0.0.1:5000;
            }

            location /assets/ {
                try_files $uri =404;
            }

            location / {
                try_files $uri $uri/ /index.html;
            }
       }
    }