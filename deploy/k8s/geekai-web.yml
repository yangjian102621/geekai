apiVersion: v1
kind: Service
metadata:
  name: geekai-web
  namespace: thinkbuddy
spec:
  type: ClusterIP
  selector:
    app: geekai-web
  ports:
    - name: web
      port: 8000
      targetPort: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geekai-web
  namespace: thinkbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geekai-web
  template:
    metadata:
      labels:
        app: geekai-web
    spec:
      nodeName: node1
      containers:
        - name: geekai-web
          image: 10.8.65.4/geekai/geekai-web:20261123-web-74488654
          imagePullPolicy: Never
          ports:
            - name: web
              containerPort: 8000
          env:
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /index.html
              port: web
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /index.html
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: geekai-cm
