map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    root /var/www/app/dist;
    index index.html;

    # 门户站点与后台合并为同一个 Vue SPA（web/dist）：
    # /admin/* 及 /login /register 都回退到根 index.html，由前端路由接管。
    location /admin/ {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(login|register)/?$ {
        try_files /index.html =404;
    }

    location = /v1/events {
        # 后端 ClientEventMaxBytes 限制为 256 KiB，这里放宽到 1m 以让后端返回结构化 413。
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://geekai-api:5000;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://geekai-api:5000;
    }

    location /static/ {
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_pass http://geekai-api:5000;
    }

    # /update/ 提供桌面端安装包（几百 MB），延长读超时避免慢速下载被掐断。
    location /update/ {
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://geekai-api:5000;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
