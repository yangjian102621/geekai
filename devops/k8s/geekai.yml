---
apiVersion: v1
kind: Namespace
metadata:
  name: thinkbuddy
---
# Store uploads, LevelDB data and API logs in PVC subdirectories.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geekai-data-pvc
  namespace: thinkbuddy
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: csi-cephfs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geekai
  namespace: thinkbuddy
spec:
  # LevelDB requires one process; stop the old Pod before updates.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: geekai
  template:
    metadata:
      labels:
        app: geekai
    spec:
      nodeName: node1
      hostAliases:
        - ip: "10.233.1.240"
          hostnames:
            - "weknora.hanyoai.com"
      containers:
        - name: geekai-api
          image: 10.8.65.4/geekai/geekai-api:20261123-f2de7bba
          imagePullPolicy: Never
          workingDir: /var/www/app
          ports:
            - name: api
              containerPort: 5000
          env:
            - name: UPDATE_DIR
              value: "/var/www/app/update"
            - name: CONFIG_FILE
              value: "/var/www/app/config.toml"
            - name: GEEKAI_DEBUG
              value: "true"
            - name: GEEKAI_LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: data
              mountPath: /var/www/app/update
              subPath: update
            - name: config
              mountPath: /var/www/app/config.toml
              subPath: config.toml
              readOnly: true
            - name: data
              mountPath: /var/www/app/static
              subPath: static
            - name: data
              mountPath: /var/www/app/data
              subPath: data
            - name: data
              mountPath: /var/www/app/logs
              subPath: logs
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 20
            timeoutSeconds: 3

        - name: geekai-web
          image: 10.8.65.4/geekai/geekai-web:20261123-web-74488654
          imagePullPolicy: Never
          ports:
            - name: web
              containerPort: 8000
          env:
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /index.html
              port: web
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /index.html
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 20
            timeoutSeconds: 3

        - name: geekai-tika
          image: docker.m.daocloud.io/apache/tika:latest
          imagePullPolicy: Never
          ports:
            - name: tika
              containerPort: 9998
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx768m"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: tika
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: tika
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: tika
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: geekai-cm
        - name: data
          persistentVolumeClaim:
            claimName: geekai-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: geekai
  namespace: thinkbuddy
spec:
  type: ClusterIP
  selector:
    app: geekai
  ports:
    - name: web
      port: 8000
      targetPort: web
    - name: api
      port: 5000
      targetPort: api